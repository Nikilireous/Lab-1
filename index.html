<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Студенты — список</title>
  <link rel="icon" href="favicon/index.jpg" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="logo">Сервис на запись в общежитие</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">Студенты</a>
        <a href="student-form.html" class="nav-link active">Добавить</a>
      </nav>
    </div>
  </header>

  <main class="main" id="main-content">
    <div class="container">
      <div id="notice" class="notice" hidden></div>

      <div class="page-header">
        <h1>Список студентов</h1>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="dorm-count">0</div>
          <div class="stat-label">Живут в общежитии</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="foreign-count">0</div>
          <div class="stat-label">Иностранных</div>
        </div>
      </div>

      <div class="controls">
        <a href="student-form.html" class="btn btn-primary">＋ Добавить студента</a>
        <div class="search-box">
          <label for="search-input" class="search-label">Поиск</label>
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="Введите ФИО или группу..."
          >
        </div>
      </div>

      <div class="table-wrapper">
        <table class="students-table" id="students-table">
          <thead>
            <tr>
              <th>Студент</th>
              <th>Группа</th>
              <th>ИСУ ID</th>
              <th>Общежитие</th>
              <th>Срок заселения</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody id="students-table-body">
          </tbody>
        </table>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon"></div>
        <h2 id="empty-title" class="empty-title">Список пуст</h2>
        <p id="empty-text" class="empty-text">Добавьте первого студента</p>
        <a href="student-form.html" class="btn btn-primary">Добавить студента</a>
      </div>

      <div id="results-summary" class="results-summary"></div>
    </div>
  </main>

  <script src="/js/cookies.js"></script>
  <script src="/js/student-servise.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
